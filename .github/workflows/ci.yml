name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        run: rustup toolchain install stable --component rustfmt --component clippy
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.toml') }}
      - name: Environment diagnostics
        # Baseline info for issue #51 (parmesan's decoder proptest fails
        # intermittently on CI, never locally): capture what SIMD tier and
        # core count this runner actually has on every run, not just failing
        # ones, so a future failure can be cross-referenced against a run
        # that passed under the same environment.
        run: |
          echo "nproc: $(nproc)"
          echo "CPU flags of interest:"
          grep -o -E '\b(avx2|avx512f|avx512bw|gfni|ssse3)\b' /proc/cpuinfo | sort -u || true
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        run: cargo test --all

  # Phase 1b: NEON yEnc encoder + aarch64 unit tests never run on x86-64.
  test-aarch64:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        run: rustup toolchain install stable --component rustfmt --component clippy
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-arm-cargo-${{ hashFiles('**/Cargo.toml') }}
      - name: Clippy (pesto + parmesan)
        run: cargo clippy -p pesto-poster -p parmesan-par2 --all-targets -- -D warnings
      - name: Test (pesto + parmesan)
        run: cargo test -p pesto-poster -p parmesan-par2 --lib
