name: Release pesto

# Separate from release-parmesan.yml and release-penne.yml: pesto is
# versioned and published independently — see crates/pesto/CHANGELOG.md and
# crates/pesto/RELEASING.md — so it gets its own tag prefix and its own
# GitHub Release, on its own cadence, entirely decoupled from parmesan's and
# penne's.
#
# To ship a new pesto binary release:
#   git tag pesto-v<version>   # matching crates/pesto/Cargo.toml
#   git push origin pesto-v<version>

on:
  push:
    tags:
      - 'pesto-v*'

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            artifact: pesto
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            artifact: pesto
            musl: true
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            artifact: pesto.exe

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install musl tools
        if: matrix.musl
        run: sudo apt-get install -y musl-tools

      - name: Install Rust
        run: rustup toolchain install stable --target ${{ matrix.target }}

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ matrix.target }}-pesto-cargo-${{ hashFiles('**/Cargo.toml') }}

      - name: Build
        run: cargo build --release -p pesto-poster --bin pesto --target ${{ matrix.target }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: target/${{ matrix.target }}/release/${{ matrix.artifact }}

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # Needed for crates/pesto/CHANGELOG.md, read below — the release notes
      # embed that version's actual entries instead of just linking to it.
      - uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4

      - name: Rename binaries
        run: |
          mv x86_64-unknown-linux-gnu/pesto pesto-linux-x86_64
          mv x86_64-unknown-linux-musl/pesto pesto-linux-x86_64-musl
          mv x86_64-pc-windows-msvc/pesto.exe pesto-windows-x86_64.exe

      # `pesto --update` refuses to install a binary whose SHA256 doesn't
      # match this file, so it must exist for every release from now on.
      - name: Generate checksums
        run: sha256sum pesto-linux-x86_64 pesto-linux-x86_64-musl pesto-windows-x86_64.exe > SHA256SUMS

      # Extracts this version's own section from crates/pesto/CHANGELOG.md
      # (between its "## [<version>]" heading and the next "## [" heading)
      # so the release notes carry the actual bullet points instead of just
      # a link to go read them. Not `generate_release_notes: true` — GitHub's
      # auto-generated notes pick the previous *tag by creation time* across
      # the whole repo, which would pull in unrelated `parmesan-v*`/
      # `penne-v*` tags interleaved with `pesto-v*` ones.
      #
      # Fails loudly (rather than shipping an empty release body) when the
      # tagged version has no matching CHANGELOG heading — almost always
      # means CHANGELOG.md wasn't updated before tagging (see RELEASING.md
      # step 4).
      - name: Extract changelog section
        run: |
          VERSION="${GITHUB_REF_NAME#pesto-v}"
          awk -v ver="$VERSION" '
            BEGIN { found = 0 }
            $0 ~ /^## \[/ {
              if (found) exit
              if ($0 ~ ("^## \\[" ver "\\]")) { found = 1; next }
              next
            }
            found { print }
          ' crates/pesto/CHANGELOG.md > /tmp/changelog-raw.md

          # Trim leading/trailing blank lines left over from the heading and
          # the blank line separating entries.
          sed -e '/./,$!d' /tmp/changelog-raw.md \
            | tac | sed -e '/./,$!d' | tac > /tmp/changelog-section.md

          if [ ! -s /tmp/changelog-section.md ]; then
            echo "::error::No '## [$VERSION]' section found in crates/pesto/CHANGELOG.md — update it before tagging (see RELEASING.md step 4)." >&2
            exit 1
          fi

          {
            cat /tmp/changelog-section.md
            echo ""
            echo "---"
            echo ""
            echo "Full history: [\`crates/pesto/CHANGELOG.md\`](https://github.com/franzopl/pesto/blob/main/crates/pesto/CHANGELOG.md)."
            echo ""
            echo "Also published to [crates.io](https://crates.io/crates/pesto-poster) and documented on [docs.rs](https://docs.rs/pesto-poster)."
          } > /tmp/release-body.md

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            pesto-linux-x86_64
            pesto-linux-x86_64-musl
            pesto-windows-x86_64.exe
            SHA256SUMS
          body_path: /tmp/release-body.md
