# Example pesto configuration.
#
# Copy this file to your config directory so pesto loads it automatically:
#
#   $XDG_CONFIG_HOME/pesto/config.toml   (or ~/.config/pesto/config.toml)
#
# Or generate it interactively with `pesto --config`.
#
# Every field is optional and can be overridden by the matching CLI flag.
# Commented-out fields show their built-in default.
#
# Windows paths: a single backslash inside a "..." string is a TOML escape
# sequence, not a literal character (e.g. "C:\nzb" is "C:" + a newline, and
# some paths simply fail to parse). Either double every backslash
# ("C:\\nzb\\arquivo"), use forward slashes instead ("C:/nzb/arquivo" — both
# Windows and pesto accept these fine), or use single-quoted 'literal'
# strings, which TOML never escapes.

# ── Single-server configuration ─────────────────────────────────────────────
#
# Use [server] + [auth] when you have one provider. For multiple servers with
# automatic failover, replace these sections with [[servers]] entries (see
# the "Multi-server failover" section below).

[server]
host = "news.example.com"
# port = 563          # NNTP port; 563 is TLS, 119 is plaintext. Default: 563.
# ssl = true          # Connect over TLS. Default: true. (--no-ssl to disable.)
# connections = 4     # Parallel NNTP connections — the main throughput lever.
                      # Default: 4. Most providers allow 10–50.
# retry_delay = 1     # Seconds to wait between failed post attempts. Default: 1.
# timeout = 120       # Per-command read timeout in seconds. Aborts a silently
# proxy = "socks5://127.0.0.1:1080" # Optional SOCKS5 proxy; socks5h is also accepted.
                      # dead connection instead of hanging until the OS keepalive
                      # fires (minutes on Windows, hours on Linux). Keep it well
                      # above the time a slow link needs to acknowledge one
                      # article, so it never trips a healthy upload. Default: 120.
# keepalive = 60      # Send MODE READER on idle connections every this many
                      # seconds to prevent the server closing them silently
                      # during PAR2 computation, check-phase waits, and --each
                      # transitions. Set to 0 to disable. Default: 60.

[auth]
# Credentials for the NNTP server. Omit the whole section for open servers.
# Never commit a real password to version control.
username = "your_username"
password = "your_password"

# ── Multi-server failover ────────────────────────────────────────────────────
#
# Define two or more [[servers]] entries to enable automatic failover.
# The first entry is the primary; the rest are tried in order when a
# connection fails. When [[servers]] is present, [server] and [auth] are
# ignored. Each entry may have its own credentials and connection count.
#
# [[servers]]
# host = "news.primary.com"
# port = 563
# ssl = true
# connections = 10
# username = "user1"
# password = "pass1"
# retry_delay = 1
# timeout = 120       # Optional per-server read timeout (seconds). Default: 120.
#
# [[servers]]
# host = "news.fallback.com"
# port = 563
# ssl = true
# connections = 4
# username = "user2"
# password = "pass2"
# retry_delay = 2

[posting]
# from — the `From` header on every article.
# When omitted, pesto posts under a freshly generated random identity, with a
# random name and a random number of characters, on every run. Set a fixed
# value only if you specifically need one.
# from = "poster <poster@example.com>"

# Newsgroups to post to. At least one is required (unless --par2-only).
# With more than one entry, one is picked at random per run to spread posts
# across the pool — it does not cross-post. To post to several groups at
# once instead, join their names with '+' in a single entry:
#   groups = ["alt.binaries.a+alt.binaries.b"]
# The two can be mixed: ["alt.binaries.a+alt.binaries.b", "alt.binaries.c"]
# picks between cross-posting a+b, or posting to c alone, each run.
groups = ["alt.binaries.test"]

# article_size — target size of each posted segment, in bytes. Default: 768000.
# article_size = 768000

# line_length — yEnc encoded line length, in characters. Default: 128.
# line_length = 128

# retries — post attempts per segment before it is marked failed. Default: 3.
# retries = 3

# obfuscate — how much of each post to hide. Default: "none".
#   "none"        real file name in the subject and the yEnc header
#   "full"        random subject and random yEnc name (recover via the .nzb)
#   "full-shared" like "full", but every file in the release (archive + PAR2
#                 volumes) shares one random name, so indexers can still
#                 group them as one release
#   "light"       like "full-shared", but the yEnc name is the shared name
#                 verbatim (same as the subject) instead of adding its own
#                 random suffix, for indexers that key grouping off an exact
#                 subject/yEnc-name match
# obfuscate = "none"

# par2 — percentage of PAR2 recovery data to generate. 0 disables it.
# Default: 10.
# par2 = 10

# par2_temp_dir — directory where intermediate PAR2 files are written during
# posting, before they're read back and posted. Default: the OS temp
# directory (e.g. /tmp), which may sit on a different filesystem — with less
# free space or a stricter disk quota — than the destination disk. Ignored
# with --par2-only, which writes PAR2 files next to the sources instead.
# par2_temp_dir = "/path/on/destination/disk/tmp"

# par2_before_upload — generate all PAR2 recovery data before posting
# anything, instead of computing it concurrently with the data upload (the
# default). Every data file, the PAR2 index and every volume are then posted
# back to back with no gap. Mirrors the two-phase workflow of tools like
# ParPar+nyuu (generate, then post). Default: false.
# par2_before_upload = false

# check — confirm every posted article via a streaming STAT check that runs
# concurrently with the upload: each article is checked check_delay seconds
# after it posts, and misses are reposted automatically. Default: true.
# check = true

# check_delay — seconds to wait after an article posts before its first STAT
# check. Default: 5.
# check_delay = 5

# check_retries — number of STAT attempts per posted copy before triggering
# a repost. Default: 3.
# check_retries = 3

# check_connections — number of dedicated parallel NNTP connections for the
# streaming check queue, carved out of the connections above (not opened on
# top of them, so the total connections used never exceeds what you
# configured). Default: 0 (a small pool, e.g. connections=50 uses 46 for
# posting and 4 for checking).
# check_connections = 0

# check_post_retries — number of times to re-post an article the check queue
# still can't find. Default: 1.
# check_post_retries = 1

# allow_incomplete_nzb — publish the NZB (and run post-upload hooks) even
# when some articles are still confirmed missing after every
# check_post_retries round. Default: false.
# allow_incomplete_nzb = false

# check_recover_percent / check_recover_max — after every check_post_retries
# round is exhausted, pesto makes one more automatic repost-and-verify
# attempt for whatever is still missing, but only when that's cheap: at or
# below check_recover_max articles, AND at or below check_recover_percent of
# the release's total segments (whichever cap is smaller wins). This is what
# turns "posting finished but the check failed for a handful of articles"
# into a self-healing run instead of a failed one requiring a manual
# --resume. Set check_recover_max = 0 to disable. Defaults: 15 and 50.
# check_recover_percent = 15
# check_recover_max = 50

# upload_rate — maximum total upload speed across all connections.
# Accepts human-readable values: "50 MiB/s", "10 MB/s", "1024 KiB/s".
# 0 or omitted means unlimited. Also settable with --rate.
# upload_rate = "0"

# date — value for the `Date:` header on each article. Options:
#   "now"    current UTC time at the moment of posting
#   "random" a random time within the last 2 hours (default when obfuscate is set)
#   A fixed RFC 2822 timestamp: "Mon, 01 Jan 2024 12:00:00 +0000"
# When omitted without obfuscation, pesto does not set the Date header and lets
# the server supply it. When obfuscate is set, "random" is used automatically.
# date = "random"

# no_archive — add `X-No-Archive: yes` to every posted article. Default: false.
# no_archive = false

# file_counter — prefix every subject with a `[filenum/total]` release-wide
# file counter, e.g. `[3/15] "movie.mkv" yEnc (1/1875)`, counting every file
# in the release (data files plus the PAR2 index and volumes). Some posting
# tools (e.g. nyuu) emit this by default and some indexers may key their
# grouping heuristics off it. Default depends on `obfuscate`: on for `none`,
# `full-shared` and `light` (which already accept cross-file correlation by
# wire metadata as part of their own design), off for `full`/`paranoid`
# (whose whole point is preventing exactly that). Set explicitly here to
# override the mode-based default either way. See ROADMAP.md "Subject file
# counter".
# file_counter = false

# message_id_domain — fixed domain used in the Message-ID of every article.
# When omitted (default), a fresh random domain is generated per article, which
# is better for privacy. Set this only if your provider requires a stable domain.
# message_id_domain = "example.com"

[compression]
# Bundle files into an archive before posting. Default: disabled.
#
# format — archive format to use. Default: "7z" (store mode, no compression).
#   "7z"  via p7zip; encrypts headers too when a password is set (-mhe=on)
#   "zip" via p7zip; standard zip with optional password (no header encryption)
#   "rar" via rar binary (not distributed; must be in PATH)
#
# Use --compress [FORMAT] on the CLI to enable for a single run.
# Use --password [PASSWORD] to add a password (implies --compress 7z).
# Omitting FORMAT or leaving format unset defaults to "7z".
#
# format = "7z"

# temp_dir — directory where the archive built by --compress is staged,
# before it's read back and posted. Default: the OS temp directory (e.g.
# /tmp), which may sit on a different filesystem — with less free space or a
# stricter disk quota — than the destination disk.
# temp_dir = "/path/on/destination/disk/tmp"

[output]
# nzb_dir — directory where .nzb hardlinks/copies are placed after each upload.
# Every upload is also archived to ~/.config/pesto/nzb/TIMESTAMP_stem.nzb so
# the canonical copy is never lost. Overridden by --out or output.nzb.
# On Windows, write this as "C:/nzb" or "C:\\nzb" — a single backslash is a
# TOML escape sequence, not a literal one (see the note at the top of this
# file).
# nzb_dir = "/home/user/nzbs"

# nzb — fixed path for the generated .nzb hardlink/copy. Overrides nzb_dir.
# Overridden by --out.
# nzb = "upload.nzb"

# nzb_conflict — what to do when the user-destination .nzb already exists.
#   overwrite  (default) — replace the existing file silently.
#   rename               — keep the old file; append -1, -2, … to the new name.
#   fail                 — abort the NZB write and exit with an error.
# The archive copy in ~/.config/pesto/nzb/ is always kept regardless of this setting.
# Can also be overridden per-run with --nzb-conflict=<mode> or --no-overwrite (=rename).
# nzb_conflict = "overwrite"

# nzb_title — value for the <meta type="title"> element in the .nzb.
# Shown as the release title in NZBGet and SABnzbd. Defaults to the upload name.
# nzb_title = "My Release (2024)"
# `nzb_name` is a deprecated alias, still accepted with a warning.

# nzb_category — value for the <meta type="category"> element in the .nzb.
# nzb_category = "TV > HD"

# nzb_tags — values for multiple <meta type="tag"> elements in the .nzb.
# Each entry becomes a separate <meta type="tag"> entry. If --nzb-tag is used
# on the command line, it replaces this list entirely.
# nzb_tags = ["hd", "2024", "dts"]

# nzb_password — value for the <meta type="password"> element in the .nzb.
# When --password is used, the archive password is stored here automatically.
# Use this only to set a static password independently of --compress.
# nzb_password = "archive_pass"

# resume — load a prior run's saved progress (from a .pesto-state sidecar
# file beside the .nzb output) and skip already-posted segments. Progress is
# always tracked and saved when a run ends incomplete, regardless of this
# setting; `resume` only controls whether that saved state is actually
# loaded back on the next run. The state file is deleted automatically once
# a run completes successfully — nothing to clean up by hand. A saved state
# is only trusted if it was recorded under matching posting parameters
# (article_size, obfuscate, compress, par2) and, per file, the same size and
# modification time; any mismatch is discarded rather than reused, so a
# stale or unrelated state file can't corrupt the .nzb. Default: false.
# resume = false

# nfo — generate a .nfo text file alongside the .nzb. Default: false.
# Runs `mediainfo` on the first video file found; falls back to a directory
# listing when no video file is present or mediainfo is not installed.
# nfo = false

# pre_hook — shell command executed before the upload begins.
# Runs via `sh -c` on Unix or `cmd /c` on Windows. If the command exits with a
# non-zero code the upload is aborted immediately — nothing is posted.
#
# You can also drop executable scripts into ~/.config/pesto/pre-hooks/ and they
# will run in alphabetical order before every upload. Those directory scripts
# are suppressed by --no-hooks; this config value and --pre-hook are not.
# Neither runs during --dry-run.
#
# Available environment variables (NZB and NFO do not exist yet at this point):
#   PESTO_NAME         — release name (entry label)
#   PESTO_BYTES        — total size in bytes of all input files
#   PESTO_INPUT_PATHS  — colon-separated list of input file/directory paths
#   PESTO_SERVER       — target NNTP server hostname
#   PESTO_GROUP        — first configured newsgroup
#   PESTO_GROUPS       — colon-separated list of all configured newsgroups
#   PESTO_CATEGORY     — value of --nzb-category (empty when not set)
#   PESTO_NZB_TITLE    — value of --nzb-title (empty when not set)
#   PESTO_NZB_NAME     — deprecated alias of PESTO_NZB_TITLE, same value
#   PESTO_OBFUSCATE    — obfuscation mode in use: none, full, or paranoid
#   PESTO_PAR2         — PAR2 redundancy percentage (e.g. 10)
#   PESTO_TAGS         — space-separated list of NZB tags (empty when none)
#   PESTO_TMDB_ID      — value of --tmdb / --tmdb-id (empty when not set)
#   PESTO_IMDB_ID      — value of --imdb-id / --imdb (empty when not set)
#   PESTO_TVDB_ID      — value of --tvdb-id / --tvdb (empty when not set)
#   PESTO_MAL_ID       — value of --mal-id / --mal (empty when not set)
#
# Use case: query NZBHydra2 or Prowlarr before uploading to avoid duplicates.
# Example (abort if the release is already indexed):
# pre_hook = "~/.config/pesto/hooks/check-duplicate.sh"
# pre_hook = ""

# post_hook — shell command executed after each successful upload.
# Runs via `sh -c` on Unix or `cmd /c` on Windows. The following environment
# variables are available: PESTO_NZB, PESTO_NFO, PESTO_NAME, PESTO_BYTES,
# PESTO_INPUT_PATHS, PESTO_SERVER, PESTO_GROUP, PESTO_GROUPS, PESTO_PASSWORD,
# PESTO_CATEGORY, PESTO_NZB_TITLE, PESTO_OBFUSCATE, PESTO_PAR2, PESTO_TAGS,
# PESTO_TMDB_ID, PESTO_IMDB_ID, PESTO_TVDB_ID, PESTO_MAL_ID, PESTO_WIRE_SUBJECT
# (the actual Subject: header sent to the NNTP server for the first posted
# file — differs from the real filename under --obfuscate).
# post_hook = "notify-send 'pesto' 'Upload done: $PESTO_NAME'"
#
# See examples/hooks/ for ready-made hook scripts (curupira.sh, generic-indexer.sh, etc.).

# no_hooks — skip the executable scripts in ~/.config/pesto/hooks/ and
# ~/.config/pesto/pre-hooks/. The pre_hook/pre_hooks and post_hook/post_hooks
# values above are unaffected — only the directory scan is suppressed.
# Also settable per-run with --no-hooks. Default: false.
# no_hooks = false

# history — write a record to history.jsonl after each upload. Default: true.
# history = true

# history_dir — directory where history.jsonl and nzb/ are stored.
# Default: ~/.config/pesto  (or $XDG_CONFIG_HOME/pesto).
# Set to ~/.config/upapasta to share the catalog with upapasta.
# history_dir = "~/.config/upapasta"

# session_log — save a per-upload DEBUG log under <history_dir>/logs/ so any
# run can be analysed afterwards without re-running with -vv. Independent of
# the -v flag. Only the 50 most recent logs are kept. Default: true.
# Disable per-run with --no-session-log.
# session_log = true

# quiet — single-line minimal output instead of the full terminal panel.
# Designed for tmux/screen users who want minimal terminal noise. Default: false.
# quiet = false

# bell — write an ASCII BEL (\a) to stderr on completion (success or failure).
# Useful for desktop notification integrations. Default: false.
# bell = false

# ── Prowlarr / indexer connection ────────────────────────────────────────────
#
# URL and API key used by upapasta to search and download NZBs from Prowlarr.
# This section is not used by the pesto CLI itself.
#
# [output.indexer]
# url     = "https://prowlarr.example.com"
# api_key = "abc123"

# ── Completion notifications ─────────────────────────────────────────────────
#
# Send a notification after each upload (success or failure).
# Both fields are optional; omit the whole section to disable notifications.
#
# [notify]
# webhook_url — HTTP POST target (Discord, Slack, Telegram, or generic JSON).
#   Discord:  https://discord.com/api/webhooks/<id>/<token>
#   Slack:    https://hooks.slack.com/services/...
#   Telegram: https://api.telegram.org/bot<token>/sendMessage?chat_id=<id>
#   Generic:  any URL; receives a rich JSON object with upload details
# webhook_url = "https://discord.com/api/webhooks/..."
#
# ntfy_topic — ntfy.sh topic name or full URL (e.g. "https://ntfy.sh/mytopic").
# ntfy_topic = "pesto-uploads"
